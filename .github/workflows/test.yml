name: test

# The macOS job is the point of this workflow. Active-terminal detection uses
# pgrep/lsof/ps on macOS and /proc on Linux, so only a real macOS runner
# exercises that half of active-terminal.js.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # codex-tools.js requires acorn at load time, so the tests need the
      # runtime dependencies installed, not just a checkout.
      - run: npm ci
      - run: node --test test/*.test.js

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # vsce resolves the production dependency tree, which must exist on disk.
      - run: npm ci
      # Catches manifest and .vscodeignore breakage before a publish does.
      - run: npx --yes @vscode/vsce package
