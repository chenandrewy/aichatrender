<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'; img-src 'none'; script-src 'nonce-{{nonce}}'; style-src-elem {{cspSource}} 'nonce-{{nonce}}'; style-src-attr 'unsafe-inline'; font-src {{cspSource}}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIChatRender</title>
<link rel="stylesheet" href="{{katexCss}}">
<style nonce="{{nonce}}">
  html {
    font-size: var(--vscode-font-size, 13px);
  }
  body {
    font-family: var(--vscode-font-family, sans-serif);
    font-size: 108%;
    color: var(--vscode-editor-foreground);
    background: var(--vscode-editor-background);
    margin: 0;
    padding: 0.5em 1em 2em;
  }
  #status, #notice {
    font-style: italic;
    opacity: 0.8;
    padding: 0.3em 0;
  }
  #status:empty, #notice:empty { display: none; }
  #notice { color: var(--vscode-editorWarning-foreground, #c90); }
  #log { padding-right: 3ch; }
  article {
    margin: 0.8em 0;
    padding: 0.2em 0 0.2em 0.8em;
    border-left: 2px solid var(--vscode-panel-border, #888);
  }
  article.user {
    border: 2px solid var(--vscode-charts-blue, #47f);
    border-radius: 4px;
    padding: 0.6em 0.8em;
    opacity: 0.85;
  }
  /* Tool calls are context for the prose around them, not the subject: compact,
     monospace, and dimmed until hovered. */
  article.tool {
    margin: 0.3em 0;
    padding: 0 0 0 0.8em;
    border-left: 2px solid transparent;
    font-family: var(--vscode-editor-font-family, monospace);
    font-size: 0.9em;
    opacity: 0.7;
  }
  article.tool:hover { opacity: 1; }
  article.tool.error { border-left-color: var(--vscode-editorError-foreground, #c33); }
  .tool-call { margin: 0; overflow-wrap: break-word; }
  .tool-call::before {
    content: '⏺ ';
    color: var(--vscode-charts-green, #3a3);
  }
  article.tool.error .tool-call::before { color: var(--vscode-editorError-foreground, #c33); }
  .tool-name { font-weight: 600; }
  .tool-arg { opacity: 0.85; }
  .tool-result {
    margin: 0.1em 0 0 2ch;
    padding: 0;
    background: transparent;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    opacity: 0.85;
  }
  .tool-note {
    margin: 0 0 0 2ch;
    font-style: italic;
    opacity: 0.7;
  }
  @keyframes aicr-flash {
    from { background: var(--vscode-editor-findMatchHighlightBackground, rgba(255, 200, 0, 0.45)); }
    to { background: transparent; }
  }
  article.flash {
    animation: aicr-flash 1.4s ease-out 1;
  }
  @media (prefers-reduced-motion: reduce) {
    article.flash { animation-duration: 0.01s; }
  }
  article header {
    font-size: 0.85em;
    opacity: 0.65;
    margin-bottom: 0.25em;
  }
  .message-body { white-space: pre-wrap; overflow-wrap: break-word; }
  .math.display { margin: 0.4em 0; overflow-x: auto; }
  .katex { font-size: 1.1em; }
  .message-body h1, .message-body h2, .message-body h3,
  .message-body h4, .message-body h5, .message-body h6 {
    margin: 0.7em 0 0.35em;
    line-height: 1.25;
  }
  .message-body h1 { font-size: 1.45em; }
  .message-body h2 { font-size: 1.3em; }
  .message-body h3 { font-size: 1.18em; }
  .message-body h4, .message-body h5, .message-body h6 { font-size: 1.08em; }
  .md-paragraph { margin: 0.4em 0; }
  .message-body ul, .message-body ol {
    margin: 0.4em 0;
    padding-left: 1.8em;
  }
  .message-body li { margin: 0.15em 0; }
  .message-body blockquote {
    margin: 0.5em 0;
    padding: 0.1em 0 0.1em 0.8em;
    border-left: 3px solid var(--vscode-textBlockQuote-border, #888);
    color: var(--vscode-textBlockQuote-foreground, var(--vscode-foreground));
    background: var(--vscode-textBlockQuote-background, transparent);
  }
  .message-body pre {
    overflow-x: auto;
    margin: 0.5em 0;
    padding: 0.6em 0.8em;
    border-radius: 3px;
    background: var(--vscode-textCodeBlock-background, rgba(127, 127, 127, 0.12));
    white-space: pre-wrap;
  }
  .message-body code {
    padding: 0.05em 0.25em;
    border-radius: 3px;
    font-family: var(--vscode-editor-font-family, monospace);
    background: var(--vscode-textCodeBlock-background, rgba(127, 127, 127, 0.12));
  }
  .message-body pre code { padding: 0; background: transparent; }
  .md-table-scroll {
    margin: 0.5em 0;
    overflow-x: auto;
  }
  .message-body table {
    border-collapse: collapse;
    /* pre-wrap on the body would preserve the source's cell padding */
    white-space: normal;
  }
  .message-body th, .message-body td {
    padding: 0.25em 0.7em;
    border: 1px solid var(--vscode-panel-border, #888);
    text-align: left;
    vertical-align: top;
  }
  .message-body th {
    font-weight: 600;
    background: var(--vscode-textCodeBlock-background, rgba(127, 127, 127, 0.12));
  }
  .message-body .md-align-left { text-align: left; }
  .message-body .md-align-center { text-align: center; }
  .message-body .md-align-right { text-align: right; }
  .message-body hr {
    height: 1px;
    margin: 0.8em 0;
    border: 0;
    background: var(--vscode-panel-border, #888);
  }
  #turn-index {
    position: fixed;
    z-index: 1;
    top: 0.6em;
    right: 0.6em;
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 1.2em);
    overflow-y: auto;
    border: 1px solid var(--vscode-panel-border, #888);
    border-radius: 4px;
    background: var(--vscode-editorWidget-background, var(--vscode-editor-background));
    opacity: 0.65;
  }
  #turn-index:hover, #turn-index:focus-within { opacity: 1; }
  #turn-index:empty { display: none; }
  #turn-index button {
    min-width: 1.6em;
    padding: 0.15em 0.35em;
    border: 0;
    color: var(--vscode-foreground);
    background: transparent;
    font: inherit;
    font-size: 0.75em;
    line-height: 1.2;
    cursor: pointer;
  }
  #turn-index button:hover, #turn-index button:focus {
    color: var(--vscode-list-activeSelectionForeground);
    background: var(--vscode-list-activeSelectionBackground);
    outline: none;
  }
</style>
</head>
<body>
<div id="status"></div>
<div id="notice"></div>
<nav id="turn-index" aria-label="User turns"></nav>
<main id="log"></main>
<script nonce="{{nonce}}" src="{{katexJs}}"></script>
<script nonce="{{nonce}}" src="{{copyTexJs}}"></script>
<script nonce="{{nonce}}" src="{{markdownJs}}"></script>
<script nonce="{{nonce}}">
(function () {
  'use strict';
  var vscodeApi = acquireVsCodeApi();
  var log = document.getElementById('log');
  var statusEl = document.getElementById('status');
  var noticeEl = document.getElementById('notice');
  var turnIndexEl = document.getElementById('turn-index');

  function validSpan(s) {
    if (!s || typeof s !== 'object' || typeof s.s !== 'string') return false;
    if (s.t === 'text') return true;
    if (s.t === 'math') return s.m === 'inline' || s.m === 'display';
    return false;
  }
  function validResult(r) {
    return r === undefined
      || (!!r && typeof r === 'object' && typeof r.text === 'string' && typeof r.more === 'number');
  }
  function validEntry(e) {
    if (!e || typeof e !== 'object' || typeof e.key !== 'number') return false;
    if (e.role === 'tool') {
      return !!e.tool && typeof e.tool === 'object'
        && typeof e.tool.name === 'string' && e.tool.name !== ''
        && typeof e.tool.summary === 'string'
        && validResult(e.result);
    }
    return (e.role === 'assistant' || e.role === 'user')
      && typeof e.tsDisplay === 'string'
      && Array.isArray(e.spans) && e.spans.every(validSpan);
  }

  function appendInlineText(parent, text) {
    var pattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*)/g;
    var from = 0;
    var match;
    while ((match = pattern.exec(text)) !== null) {
      if (match.index > from) parent.appendChild(document.createTextNode(text.slice(from, match.index)));
      var source = match[0];
      var tag = source[0] === '`'
        ? 'code'
        : source.slice(0, 2) === '**' || source.slice(0, 2) === '__' ? 'strong' : 'em';
      var width = tag === 'em' || tag === 'code' ? 1 : 2;
      var inline = document.createElement(tag);
      inline.textContent = source.slice(width, -width);
      parent.appendChild(inline);
      from = pattern.lastIndex;
    }
    if (from < text.length) parent.appendChild(document.createTextNode(text.slice(from)));
  }

  function appendMath(parent, span) {
    var el = document.createElement(span.m === 'display' ? 'div' : 'span');
    el.className = 'math ' + span.m;
    try {
      katex.render(span.s, el, {
        displayMode: span.m === 'display',
        throwOnError: false,
        trust: false,
        maxExpand: 1000,
        maxSize: 20
      });
    } catch (err) {
      el.textContent = span.s;
    }
    parent.appendChild(el);
  }

  function appendTokens(parent, tokens) {
    for (var i = 0; i < tokens.length; i++) {
      var token = tokens[i];
      if (token.t === 'text') appendInlineText(parent, token.s);
      else appendMath(parent, token);
    }
  }

  function appendLines(parent, lines) {
    for (var i = 0; i < lines.length; i++) {
      if (i > 0) parent.appendChild(document.createElement('br'));
      appendTokens(parent, lines[i]);
    }
  }

  function tableRow(cellTag, cells, align) {
    var tr = document.createElement('tr');
    for (var i = 0; i < cells.length; i++) {
      var cell = document.createElement(cellTag);
      if (align[i]) cell.className = 'md-align-' + align[i];
      appendTokens(cell, cells[i]);
      tr.appendChild(cell);
    }
    return tr;
  }

  function renderMarkdown(parent, spans) {
    var blocks = AIChatRenderMarkdown.parse(spans);
    for (var i = 0; i < blocks.length; i++) {
      var block = blocks[i];
      var el;
      if (block.type === 'heading') {
        el = document.createElement('h' + block.level);
        appendTokens(el, block.content);
      } else if (block.type === 'list') {
        el = document.createElement(block.ordered ? 'ol' : 'ul');
        for (var j = 0; j < block.items.length; j++) {
          var item = document.createElement('li');
          if (block.ordered) item.setAttribute('value', String(block.values[j]));
          appendTokens(item, block.items[j]);
          el.appendChild(item);
        }
      } else if (block.type === 'blockquote') {
        el = document.createElement('blockquote');
        appendLines(el, block.lines);
      } else if (block.type === 'code') {
        el = document.createElement('pre');
        if (block.language) el.setAttribute('data-language', block.language);
        var code = document.createElement('code');
        code.textContent = block.text;
        el.appendChild(code);
      } else if (block.type === 'table') {
        el = document.createElement('div');
        el.className = 'md-table-scroll';
        var table = document.createElement('table');
        var thead = document.createElement('thead');
        thead.appendChild(tableRow('th', block.header, block.align));
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        for (var r = 0; r < block.rows.length; r++) {
          tbody.appendChild(tableRow('td', block.rows[r], block.align));
        }
        table.appendChild(tbody);
        el.appendChild(table);
      } else if (block.type === 'rule') {
        el = document.createElement('hr');
      } else {
        el = document.createElement('div');
        el.className = 'md-paragraph';
        appendLines(el, block.lines);
      }
      parent.appendChild(el);
    }
  }

  // Tool calls, shaped after the CLI's own display: the call on one line, a
  // clipped result under it, and a count of the lines not shown. Every part is
  // assigned with textContent — tool output is arbitrary bytes and is never
  // parsed as Markdown, math, or HTML.
  function renderTool(art, e) {
    if (e.result && e.result.isError) art.classList.add('error');
    var call = document.createElement('div');
    // md-paragraph is what the clipboard serialiser treats as a block, so the
    // call line copies as its own line rather than running into the result.
    call.className = 'tool-call md-paragraph';
    var name = document.createElement('span');
    name.className = 'tool-name';
    name.textContent = e.tool.name;
    call.appendChild(name);
    if (e.tool.summary) {
      var arg = document.createElement('span');
      arg.className = 'tool-arg';
      arg.textContent = '(' + e.tool.summary + ')';
      call.appendChild(arg);
    }
    art.appendChild(call);
    if (e.result === undefined) {
      var pending = document.createElement('div');
      pending.className = 'tool-note md-paragraph';
      pending.textContent = 'running…';
      art.appendChild(pending);
      return;
    }
    if (e.result.text) {
      var out = document.createElement('pre');
      out.className = 'tool-result';
      out.textContent = e.result.text;
      art.appendChild(out);
    }
    if (e.result.more > 0 || !e.result.text) {
      var note = document.createElement('div');
      note.className = 'tool-note md-paragraph';
      note.textContent = e.result.more > 0
        ? '+' + e.result.more + (e.result.more === 1 ? ' line' : ' lines')
        : '(no output)';
      art.appendChild(note);
    }
  }

  // --- clipboard -----------------------------------------------------------
  // Own plain-text copies made inside the transcript so every rendered
  // structure goes back to its Markdown source. KaTeX's handler remains loaded
  // for selections elsewhere in the webview.

  document.addEventListener('copy', function (ev) {
    var selection = window.getSelection();
    if (!selection || selection.isCollapsed || !ev.clipboardData) return;
    var sourceRange = selection.getRangeAt(0);
    if (!log.contains(sourceRange.commonAncestorContainer)) return;
    var fragment = AIChatRenderMarkdown.cloneSelectionWithContext(sourceRange, log);
    ev.clipboardData.setData('text/plain', AIChatRenderMarkdown.serializeMarkdown(fragment));
    ev.preventDefault();
    ev.stopImmediatePropagation(); // keep copy-tex from overwriting Markdown
  }, true); // capture: runs before copy-tex's bubble-phase listener

  // Prose is assigned with textContent or text nodes; only math source reaches KaTeX.
  function render(msg) {
    statusEl.textContent = typeof msg.status === 'string' ? msg.status : '';
    noticeEl.textContent = typeof msg.notice === 'string' ? msg.notice : '';
    var atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 40;
    log.replaceChildren();
    turnIndexEl.replaceChildren();
    var entries = Array.isArray(msg.entries) ? msg.entries : [];
    var turnNumber = 0;
    for (var i = 0; i < entries.length; i++) {
      var e = entries[i];
      if (!validEntry(e)) continue;
      var art = document.createElement('article');
      art.className = e.role;
      art.dataset.key = String(e.key);
      if (e.role === 'tool') {
        renderTool(art, e);
        log.appendChild(art);
        continue;
      }
      if (e.role === 'user') {
        turnNumber++;
        art.id = 'user-turn-' + turnNumber;
        var turnButton = document.createElement('button');
        turnButton.type = 'button';
        turnButton.textContent = String(turnNumber);
        turnButton.title = 'Go to user turn ' + turnNumber;
        turnButton.setAttribute('aria-label', turnButton.title);
        turnButton.dataset.target = art.id;
        turnIndexEl.appendChild(turnButton);
      }
      var head = document.createElement('header');
      head.textContent = (e.role === 'user' ? '==== You ====' : '==== Agent Response ====') + (e.tsDisplay ? ' · ' + e.tsDisplay : '');
      art.appendChild(head);
      var body = document.createElement('div');
      body.className = 'message-body';
      renderMarkdown(body, e.spans);
      art.appendChild(body);
      log.appendChild(art);
    }
    if (atBottom) window.scrollTo(0, document.body.scrollHeight);
  }

  function flash(target) {
    target.classList.remove('flash');
    void target.offsetWidth; // restart the animation on a repeat jump
    target.classList.add('flash');
  }

  turnIndexEl.addEventListener('click', function (ev) {
    var button = ev.target.closest('button[data-target]');
    if (!button || !turnIndexEl.contains(button)) return;
    var target = document.getElementById(button.dataset.target);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      flash(target);
    }
  });

  // Scroll to the message the turn picker chose. Keys are assigned by the
  // extension and are stable across re-renders; a key that has since scrolled
  // out of the retained window simply finds nothing.
  function gotoMessage(key) {
    if (typeof key !== 'number' || !isFinite(key)) return;
    var target = log.querySelector('article[data-key="' + String(key) + '"]');
    if (!target) return;
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    flash(target);
  }

  window.addEventListener('message', function (ev) {
    var m = ev.data;
    if (!m) return;
    if (m.type === 'replaceHistory') render(m);
    else if (m.type === 'gotoMessage') gotoMessage(m.key);
  });
  vscodeApi.postMessage({ type: 'ready' });
})();
</script>
</body>
</html>
